name: Build Platforms

on:
  workflow_call:
    inputs:
      build_profile:
        description: 'Gradle build profile (debug or release)'
        required: true
        type: string
    secrets:
      STORE_FILE:
        required: false
      STORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  JAVA_VERSION: 21
  GO_VERSION: '1.26.3'
  PROTOC_VERSION: '29.3'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Build Native Components
        run: make desktop

      - name: Build Desktop (Linux x64)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=${{ inputs.build_profile }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: composeApp/build/compose/binaries/main/deb/*.deb
          archive: false
          if-no-files-found: warn

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-windows-

      - name: Build Native Components
        run: make desktop

      - name: Build Desktop (Windows x64)
        shell: cmd
        run: gradlew.bat :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=${{ inputs.build_profile }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: composeApp/build/compose/binaries/main/msi/*.msi
          archive: false
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install gomobile and protoc-gen-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          gomobile init

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Decode Keystore
        if: inputs.build_profile == 'release'
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 --decode > proxytoolboxgui.jks

      - name: Create keystore.properties
        if: inputs.build_profile == 'release'
        run: |
          echo "STORE_FILE=proxytoolboxgui.jks" > keystore.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> keystore.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Native Components
        run: make android

      - name: Build Android APK
        run: ./gradlew :androidApp:assemble${{ inputs.build_profile == 'release' && 'Release' || 'Debug' }} --no-daemon

      - name: Upload Artifacts (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/${{ inputs.build_profile }}/*_arm64-v8a_*.apk
          archive: false

      - name: Upload Artifacts (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/${{ inputs.build_profile }}/*_armeabi-v7a_*.apk
          archive: false

      - name: Upload Artifacts (x86_64)
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/${{ inputs.build_profile }}/*_x86_64_*.apk
          archive: false

      - name: Upload Artifacts (x86)
        uses: actions/upload-artifact@v7
        with:
          path: |
            androidApp/build/outputs/apk/${{ inputs.build_profile }}/*_x86_*.apk
            !androidApp/build/outputs/apk/${{ inputs.build_profile }}/*_x86_64_*.apk
          archive: false
