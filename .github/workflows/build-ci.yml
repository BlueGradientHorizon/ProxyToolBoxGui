name: CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  GO_VERSION: '1.26.2'
  PROTOC_VERSION: '29.3'

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Build Desktop (Linux x64)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=debug

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-linux-x64
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-windows-

      - name: Build Desktop (Windows x64)
        shell: cmd
        run: gradlew.bat :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=debug

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-windows-x64
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install gomobile and protoc-gen-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          gomobile init

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Build Android APK (Debug)
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload Android arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-android-arm64-v8a
          path: androidApp/build/outputs/apk/debug/*_arm64-v8a_*.apk

      - name: Upload Android armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-android-armeabi-v7a
          path: androidApp/build/outputs/apk/debug/*_armeabi-v7a_*.apk

      - name: Upload Android x86
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-android-x86
          path: androidApp/build/outputs/apk/debug/*_x86_*.apk

      - name: Upload Android x86_64
        uses: actions/upload-artifact@v4
        with:
          name: proxytoolboxgui-android-x86_64
          path: androidApp/build/outputs/apk/debug/*_x86_64_*.apk
