name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  GO_VERSION: '1.26.2'
  PROTOC_VERSION: '29.3'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install gomobile and protoc-gen-go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          gomobile init

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.STORE_FILE }}" | base64 --decode > proxytoolboxgui.jks

      - name: Create keystore.properties
        run: |
          echo "STORE_FILE=proxytoolboxgui.jks" > keystore.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> keystore.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload Android arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-android-arm64-v8a-release
          path: androidApp/build/outputs/apk/release/*_arm64-v8a_*.apk

      - name: Upload Android armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-android-armeabi-v7a-release
          path: androidApp/build/outputs/apk/release/*_armeabi-v7a_*.apk

      - name: Upload Android x86
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-android-x86-release
          path: androidApp/build/outputs/apk/release/*_x86_*.apk

      - name: Upload Android x86_64
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-android-x86_64-release
          path: androidApp/build/outputs/apk/release/*_x86_64_*.apk

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Build Desktop (Linux x64)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-linux-x64-release
          path: composeApp/build/compose/binaries/main/deb/*.deb

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-windows-

      - name: Build Desktop (Windows x64)
        shell: cmd
        run: gradlew.bat :composeApp:packageDistributionForCurrentOS --no-daemon -Pcompose.desktop.buildTypes=release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: proxytoolboxgui-windows-x64-release
          path: composeApp/build/compose/binaries/main/msi/*.msi

  create-release:
    needs: [ build-android, build-desktop-linux, build-desktop-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.deb
            artifacts/**/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
