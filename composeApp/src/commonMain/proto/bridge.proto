syntax = "proto3";

package com.bghorizon.proxytoolboxgui.proto;

option java_package = "com.bghorizon.proxytoolboxgui.proto";
option java_multiple_files = true;
option go_package = "github.com/bluegradienthorizon/proxytoolboxgui/gowrapper/proto";

message PBWorkerInfo {
    string name = 1;
    string version = 2;
    string path = 3;
}

message PBWorkerInfoList {
    repeated PBWorkerInfo workers = 1;
}

message PBProxyConfig {
    string tag = 1;
    string conn_uri = 2;
    int64 delay = 3;
}

message PBProxyConfigList {
    repeated PBProxyConfig configs = 1;
}

message PBStringMap {
    map<string, string> items = 1;
}

message PBDiscoverWorkersRequest {
    string library_path = 1;
}

message PBDiscoverWorkersResponse {
    PBWorkerInfoList workers = 1;
    optional string error = 2;
}

message PBInitializeRunnerRequest {
    string worker_path = 1;
    bool low_mem_mode = 2;
}

message PBInitializeRunnerResponse {
    bool success = 1;
    optional string error = 2;
}

message PBParseConfigsResponse {
    PBStringMap parse_errors = 1;
    optional string error = 2;
}

message PBValidateConfigsResponse {
    PBStringMap validate_errors = 1;
    optional string error = 2;
}

message PBRunLatencyTestsRequest {
    string test_url = 1;
    int32 latency_rounds = 2;
    int32 round_timeout = 3;
    bool test_by_batches = 4;
    int32 batch_size = 5;
}

message PBRunLatencyTestsResponse {
    PBProxyConfigList configs = 1;
    optional string error = 2;
}

message PBDiscoverSpeedTestPresetsResponse {
    PBStringMap presets = 1;
    optional string error = 2;
}

enum PBSpeedTestMode {
    DOWNLOAD = 0;
    UPLOAD = 1;
}

message PBRunSpeedTestsRequest {
    repeated string tags = 1;
    string provider_id = 2;
    PBSpeedTestMode mode = 3;
    int32 rounds = 4;
    int32 timeout = 5;
    int64 target_bytes = 6;
}

message PBSpeedTestResult {
    string tag = 1;
    double speed = 2; // bytes/s
    optional string error = 3;
}

message PBRunSpeedTestsResponse {
    repeated PBSpeedTestResult results = 1;
    optional string error = 2;
}
